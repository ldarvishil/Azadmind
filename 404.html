<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه مورد نظر یافت نشد | آکادمی ذهن آزاد</title>
  <!-- Tailwind CSS CDN -->
  <!-- HeroUI Pure CSS Framework -->
  <link rel="stylesheet" href="css/heroui.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased flex flex-col min-h-screen">

  <header class="sticky top-0 z-50 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="relative flex items-center justify-between h-16">
        <div class="flex items-center gap-3">
          <a href="index.html" class="flex items-center group py-1" aria-label="آکادمی ذهن آزاد">
            <img src="assets/logo.svg" alt="آکادمی ذهن آزاد" class="h-9 w-auto object-contain" />
          </a>
        </div>
        <div class="flex items-center gap-2">
          <button id="theme-toggle" class="hui-close-btn" style="width: 2.1rem; height: 2.1rem;" title="تغییر تم">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-5.4-5.4c0-1.81 .89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center p-6 text-center">
    <div class="hui-card max-w-md space-y-6 sm:p-10">
      <span class="hui-badge hui-badge--danger" style="font-size: 1rem; padding: 0.25rem 0.75rem;">خطای ۴۰۴</span>
      <h1 class="text-3xl font-black text-slate-900 dark:text-white">صفحه یافت نشد!</h1>
      <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">
        متأسفانه صفحه‌ای که به دنبال آن بودید یافت نشد یا منتقل شده است.
      </p>
      <a href="index.html" class="hui-btn hui-btn--primary hui-btn--lg hui-btn--full">
        بازگشت به صفحه اصلی
      </a>
    </div>
  </main>

  <footer class="bg-slate-950 text-slate-400 py-6 border-t border-slate-800 text-xs text-center">
    <p>© ۱۴۰۴ آکادمی ذهن آزاد. تمامی حقوق محفوظ است.</p>
  </footer>

  <script src="js/heroui.js"></script>
  <script>
    const themeToggle = new HeroUI.ThemeToggle();
    document.getElementById('theme-toggle').addEventListener('click', () => themeToggle.toggle());
  </script>
</body>
</html>
